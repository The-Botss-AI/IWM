name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so the full-history secret scan also covers older branches.
    - cron: '27 3 * * 1'

permissions:
  contents: read

# CodeQL is not a job here: the repository runs it through GitHub's default
# code scanning setup, which refuses SARIF from a second, advanced setup.

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          # Block a pull request that adds a dependency with a known high or
          # critical vulnerability. Existing ones are Dependabot's job.
          fail-on-severity: high
